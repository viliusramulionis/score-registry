<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šlagerina — Lietuviškos muzikos viktorina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@1..900&family=Roboto+Slab:wght@100..900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --blood: #c4162a;
            --blood-bright: #f1263c;
            --bone: #f5eee8;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, Helvetica;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgb(116 8 21 / 38%), transparent 58%),
                radial-gradient(ellipse at 0% 100%, rgb(91 7 18 / 25%), transparent 45%),
                repeating-linear-gradient(135deg, rgb(255 255 255 / 1.5%) 0 1px, transparent 1px 5px),
                #090809;
            color: var(--bone);
            font-family: "Zilla Slab", serif;
        }

        .wrap {
            max-width: 1024px;
            margin: 28px auto;
            padding: 0 16px;
        }

        .title {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-family: "Hepta Slab", serif;
            font-size: 80px;
            font-weight: 800;
            color: var(--bone);
            text-transform: uppercase;
            margin: 0 0 12px;
            text-shadow: 5px 5px 0 var(--blood), 10px 10px 0 #000;
            text-align: center;
            position: relative;
            width: fit-content;
            letter-spacing: -0.06em;
            isolation: isolate;
        }

        h1::before,
        h1::after {
            content: "Šlagerina";
            font-family: "Hepta Slab", serif;
            font-size: 80px;
            font-weight: 800;
            color: var(--blood);
            text-transform: uppercase;
            margin: 0 0 12px;
            text-align: center;
            position: absolute;
            left: 0;
            z-index: -1;
            opacity: .35;
        }

        h1::before {
            top: -21px;
            left: -17px;
            text-shadow: -12px 12px 0 #000;
        }

        h1::after {
            top: 21px;
            left: 17px;
            text-shadow: -10px 10px 0 #000;
        }

        h2 {
            margin: 0;
            text-transform: uppercase;
            font-weight: 700;
            font-size: 32px;
            text-align: center;
            margin-bottom: 0;
            background: linear-gradient(110deg, #650b17, var(--blood), #650b17);
            color: var(--bone);
            width: fit-content;
            padding: 8px 18px;
            margin: 0 auto;
            border: 1px solid #f1263c;
            box-shadow: 5px 5px 0 #000, 0 0 24px rgb(193 20 42 / 25%);
            letter-spacing: .06em;
        }

        .players p {
            text-align: center;
            font-size: 24px;
            width: 100%;
            margin: 0;
            color: var(--bone);
            text-shadow: 0 2px 8px #000;
        }

        .players {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            margin-top: 50px;
        }

        .player {
            width: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .col-heading {
            background: linear-gradient(145deg, #231619, #0b090a 70%);
            color: var(--bone);
            padding: 10px 8px;
            text-align: center;
            font-weight: 600;
            border: 1px solid #67121e;
            border-top: 3px solid var(--blood);
            box-shadow: 0 5px 14px rgb(0 0 0 / 55%);
            font-size: 24px;
        }

        .cell {
            appearance: none;
            -webkit-appearance: none;
            background: linear-gradient(145deg, #1d1517, #090809 72%);
            color: var(--blood-bright);
            border: 1px solid #67121e;
            border-bottom: 4px solid var(--blood);
            padding: 0;
            margin: 0;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: transform .06s, opacity .12s;
            width: 100%;
            font-size: 34px;
            font-family: "Hepta Slab", serif;
            font-weight: 800;
            text-shadow: 0 0 16px rgb(241 38 60 / 45%);
            box-shadow: 0 7px 18px rgb(0 0 0 / 50%);
        }

        .cell:active {
            transform: scale(.995);
            background: #2a0d12;
        }

        .cell:focus-visible {
            outline: 3px solid var(--bone);
            outline-offset: 3px;
        }

        .cell.disabled {
            background: #171416;
            color: #756d6f;
            border-color: #393235;
            cursor: default;
            opacity: .85;
            text-shadow: none;
        }

        .qr {
            position: absolute;
            top: 35px;
            right: 35px;
        }

        .timer {
            display: none;
            position: absolute;
            background: linear-gradient(145deg, #420a12, #10090b);
            color: var(--bone);
            top: 30px;
            left: 30px;
            font-size: 130px;
            padding: 10px 0 20px;
            font-weight: 800;
            width: 270px;
            text-align: center;
            border: 2px solid var(--blood);
            box-shadow: 0 0 30px rgb(193 20 42 / 35%), 0 8px 24px #000;
            text-shadow: 0 0 18px var(--blood-bright);
        }

        @media (max-width:520px) {
            h1,
            h1::before,
            h1::after {
                font-size: clamp(42px, 12vw, 64px);
            }

            h2 {
                font-size: clamp(20px, 6vw, 28px);
            }

            .players {
                margin-top: 32px;
            }

            .col-heading {
                font-size: 18px;
                overflow-wrap: anywhere;
            }

            .cell {
                height: 68px;
                font-size: 24px;
            }

            .timer {
                top: 12px;
                left: 12px;
                width: 96px;
                padding: 4px 0 8px;
                font-size: 48px;
            }
        }
    </style>
</head>

<body>
    <!-- One update -->
    <main class="wrap">
        <!-- <div class="qr"> -->
        <!-- <img src="/static/qr-code.png" alt="" width="150"> -->
        <!-- </div> -->
        <div class="timer"></div>
        <div class="title">
            <h1>Šlagerina</h1>
        </div>
        <h2>Protų susirėmimas</h2>
        <!-- Temp -->
        <div id="players" class="players" aria-hidden="false">
           
        </div>
    </main>
    <div></div>

    <script>
        (function () {
            const playersContainer = document.getElementById('players');
            const timerEl = document.querySelector('.timer');
            let timer;

            fetch('/api/players')
                .then(response => response.json())
                .then(data => {
                    renderGrid(data);
                });


            function renderGrid(players) {
                playersContainer.innerHTML = '';

                if (!players || players.length === 0) {
                    playersContainer.innerHTML = '<p>Pradėsime netrukus...</p>';
                    return;
                }

                players.forEach((n, ci) => {
                    const playerEl = document.createElement('div');
                    playerEl.className = 'player';

                    const el = document.createElement('div');
                    el.className = 'col-heading';
                    el.textContent = n.name;
                    el.setAttribute('data-col', ci + 1);
                    playerEl.appendChild(el);

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'cell';
                    btn.title = `Row ${1} — Column ${ci + 1}`;
                    btn.textContent = n.points;

                    // btn.addEventListener('click', function onClick(e){
                    //     // disable future clicks
                    //     btn.disabled = true;
                    //     btn.classList.add('disabled');
                    //     // show a simple mark to indicate it's been clicked
                    //     btn.textContent = '✓';
                    //     // remove listener to be explicit
                    //     btn.removeEventListener('click', onClick);
                    // });

                    playerEl.appendChild(btn);

                    playersContainer.appendChild(playerEl);
                });
            }

            function createTimer() {
                timerEl.textContent = '30';
                timerEl.style.display = 'block';

                if (timer) {
                    clearInterval(timer);
                }

                timer = setInterval(() => {
                    let seconds = parseInt(timerEl.textContent);
                    seconds--;

                    if (isNaN(seconds) || seconds <= 0) {
                        clearInterval(timer);
                        timerEl.textContent = '00';
                        return;
                    }

                    timerEl.textContent = `${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }

            function removeTimer() {
                timerEl.style.display = 'none';
                timerEl.textContent = '';

                if (timer) {
                    clearInterval(timer);
                    timer = null;
                }
            }


            function setupWEbsocket() {
                const ws = new WebSocket(`wss://${window.location.href.split('://')[1]}updates`);

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    console.log('New counter value:', data);
                    if (data.type === 'timer-start') {
                        // handle timer start if needed
                        createTimer();
                    } else if (data.type === 'timer-remove') {
                        // handle timer stop if needed
                        removeTimer();
                    } else {
                        renderGrid(data.data);
                    }
                };

                ws.onclose = () => {
                    console.log('WebSocket connection closed');
                    setupWEbsocket();
                };
            };

            setupWEbsocket();

        })();
    </script>
</body>

</html>
